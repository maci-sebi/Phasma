    <main class="paragraf" style="max-width:700px;margin:0 auto;padding-bottom: 50px;">
        <header>
            <h1>Kontakt</h1>
        </header>

        <div style="display: flex; flex-wrap: wrap; gap: 40px; margin-top: 30px;">

            <div style="flex: 1.5; min-width: 300px;" class="contact-form-container">
                <h2>Napište nám</h2>
                <form action="kontakt.php" method="POST">
                    <div class="form-group">
                        <label for="name">Jméno</label>
                        <input type="text" id="name" name="name" required placeholder="Vaše jméno">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="Váš e-mail">
                    </div>
                    <div class="form-group">
                        <label for="subject">Předmět</label>
                        <input type="text" id="subject" name="subject" required placeholder="Předmět zprávy">
                    </div>
                    <div class="form-group">
                        <label for="message">Zpráva</label>
                        <textarea id="message" name="message" rows="5" required
                            placeholder="Napište svou zprávu sem..."></textarea>
                    </div>
                    <button type="submit" class="form-submit-btn">Odeslat zprávu</button>
                </form>
            </div>
        </div>
    </main>
